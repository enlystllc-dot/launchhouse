<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f3">
  <meta name="description" content="Free training: How To Launch A Startup In 2 Hours.">
  <title>Free Training — Launch House</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f7f7f3;
      --ink:#111416;
      --muted:#727a7d;
      --max:980px;
    }

    *{box-sizing:border-box}

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:"DM Sans",Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    .wrap{
      width:min(var(--max),calc(100% - 32px));
      margin:0 auto;
    }

    .top{
      padding:26px 0 14px;
    }

    .top-inner{
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .logo{
      width:150px;
      height:auto;
      display:block;
    }

    .hero{
      padding:42px 0 36px;
      text-align:center;
    }

    .eyebrow{
      color:#747b7e;
      font-size:11px;
      font-weight:800;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    h1{
      max-width:760px;
      margin:12px auto 12px;
      font-family:"Space Grotesk",Arial,sans-serif;
      font-size:clamp(40px,6vw,68px);
      line-height:.95;
      letter-spacing:-.06em;
    }

    .sub{
      max-width:650px;
      margin:0 auto;
      color:var(--muted);
      font-size:16px;
      line-height:1.55;
    }

    .video-wrap{
      width:min(920px,100%);
      margin:30px auto 0;
    }

    .video-shell{
      position:relative;
      width:100%;
      aspect-ratio:16/9;
      overflow:hidden;
      border-radius:20px;
      background:#0d1012;
      box-shadow:0 22px 70px rgba(17,20,22,.10);
    }

    .video-shell iframe{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border:0;
      display:block;
    }

    .cta{
      margin:20px auto 0;
      text-align:center;
    }

    .cta-button{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:48px;
      padding:0 20px;
      border-radius:11px;
      background:var(--ink);
      color:#fff;
      font-size:13px;
      font-weight:800;
      transition:transform .18s ease,background .18s ease;
    }

    .cta-button:hover{
      transform:translateY(-2px);
      background:#22282b;
    }

    .cta-note{
      margin-top:8px;
      color:#8a9093;
      font-size:10px;
    }

    footer{
      padding:58px 0 30px;
      text-align:center;
      color:#979da0;
      font-size:10px;
    }

    @media(max-width:620px){
      .top{
        padding-top:20px;
      }

      .logo{
        width:125px;
      }

      .hero{
        padding-top:32px;
      }

      h1{
        font-size:46px;
      }

      .sub{
        font-size:14px;
      }

      .video-wrap{
        margin-top:24px;
      }

      .video-shell{
        border-radius:15px;
      }

      .cta-button{
        min-height:46px;
        width:auto;
      }
    }
  </style>
</head>

<body>

  <header class="top">
    <div class="wrap top-inner">
      <a href="/" aria-label="Launch House">
        <img src="assets/launch-house-logo.png" alt="Launch House" class="logo">
      </a>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap">

        <div class="eyebrow">Free Training</div>

        <h1>How To Launch A Startup In 2 Hours</h1>

        <p class="sub">
          See how to go from an idea to a first working version — even if you don't know how to code.
        </p>

        <div class="video-wrap">
          <div class="video-shell">
            <iframe
              loading="eager"
              title="Gumlet video player"
              src="https://play.gumlet.io/embed/69cf70203dba9e85510f9b5b?autoplay=true"
              style="border:none;position:absolute;top:0;left:0;height:100%;width:100%;"
              referrerpolicy="origin"
              allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture;fullscreen;clipboard-write;"
              allowfullscreen>
            </iframe>
          </div>
        </div>

        <div class="cta">
          <a class="cta-button" href="/launch">
            Launch My Startup →
          </a>

          <div class="cta-note">
            Continue to the 2-hour Startup Build Sprint
          </div>
        </div>

      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">© 2026 Launch House</div>
  </footer>

</body>
</html>
