<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f7f3">
<meta name="description" content="Free training: How To Launch A Profitable Startup.">
<title>Free Training — Launch House</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f7f7f3;
  --ink:#111416;
  --muted:#727a7d;
  --line:rgba(17,20,22,.10);
  --lime:#c7ff41;
  --max:980px;
  --shadow:0 22px 70px rgba(17,20,22,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"DM Sans",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{text-decoration:none;color:inherit}
.wrap{width:min(var(--max),calc(100% - 32px));margin:auto}

.top{padding:26px 0 16px}
.top-inner{display:flex;justify-content:center;align-items:center}
.logo{width:150px;height:auto;display:block}

.hero{padding:46px 0 25px;text-align:center}
.eyebrow{
  color:#747b7e;
  font-size:11px;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
}
h1{
  max-width:760px;
  margin:12px auto;
  font-family:"Space Grotesk",Arial,sans-serif;
  font-size:clamp(40px,6vw,68px);
  line-height:.95;
  letter-spacing:-.06em;
}
.sub{
  max-width:650px;
  margin:0 auto;
  color:var(--muted);
  font-size:16px;
  line-height:1.55;
}

.video-wrap{
  width:min(920px,100%);
  margin:30px auto 0;
}
.video-shell{
  position:relative;
  aspect-ratio:16/9;
  overflow:hidden;
  border-radius:20px;
  background:#0d1012;
  border:1px solid rgba(17,20,22,.08);
  box-shadow:var(--shadow);
}
.gumlet-player{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  display:block;
  background:#0d1012;
}

/*
  The player URL is supplied through the Gumlet configuration below.
  The page is deliberately minimal: no sales sections, testimonials,
  pricing or navigation links.
*/

.cta-area{
  max-width:600px;
  margin:24px auto 0;
  text-align:center;
  opacity:0;
  transform:translateY(12px);
  pointer-events:none;
  visibility:hidden;
  transition:opacity .6s ease,transform .6s ease,visibility 0s linear .6s;
}
.cta-area.visible{
  opacity:1;
  transform:none;
  pointer-events:auto;
  visibility:visible;
  transition:opacity .6s ease,transform .6s ease,visibility 0s linear 0s;
}
.cta-kicker{
  color:#666d70;
  font-size:13px;
  margin-bottom:10px;
}
.cta-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:54px;
  padding:0 24px;
  border-radius:14px;
  background:var(--ink);
  color:#fff;
  font-size:14px;
  font-weight:800;
  box-shadow:0 12px 34px rgba(17,20,22,.13);
  transition:transform .18s ease,background .18s ease;
}
.cta-button:hover{transform:translateY(-2px);background:#202528}
.cta-note{margin-top:9px;color:#8a9093;font-size:11px}

footer{
  padding:70px 0 35px;
  text-align:center;
  color:#979da0;
  font-size:10px;
}

@media(max-width:620px){
  .top{padding-top:20px}
  .logo{width:125px}
  .hero{padding-top:34px}
  h1{font-size:46px}
  .sub{font-size:14px}
  .video-wrap{margin-top:24px}
  .video-shell{border-radius:15px}
  .cta-button{width:100%}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    transition:none!important;
    animation:none!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>

<body>

<header class="top">
  <div class="wrap top-inner">
    <a href="/" aria-label="Launch House">
      <img src="assets/launch-house-logo-nobg.png" alt="Launch House" class="logo">
    </a>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap">

      <div class="eyebrow">Free Training</div>

      <h1>How To Launch A Profitable Startup In 2026</h1>

      <p class="sub">
        See how to go from an idea to a first working version — even if you don't know how to code.
      </p>

      <div class="video-wrap">
        <div class="video-shell">
          <iframe
            id="gumletPlayer"
            class="gumlet-player"
            allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
            allowfullscreen
            title="How To Launch A Startup In 2 Hours"
          ></iframe>
        </div>
      </div>

      <div class="cta-area" id="ctaArea">
        <div class="cta-kicker">Ready to launch yours?</div>
        <a class="cta-button" href="/launch">
          Launch My Startup →
        </a>
        <div class="cta-note">
          Continue to the 2-hour Startup Build Sprint
        </div>
      </div>

    </div>
  </section>
</main>

<footer>
  <div class="wrap">© 2026 Launch House</div>
</footer>

<script>
/*
  FINAL DEPLOYMENT CONFIG

  The Gumlet video URL is read from a URL query parameter:
  /free-training?v=YOUR_GUMLET_EMBED_URL

  This keeps the HTML itself free of placeholder URLs.

  Example:
  https://yourdomain.com/free-training?v=https%3A%2F%2Fplay.gumlet.io%2Fembed%2F...

  The CTA goes to /launch, so place your ₹197 landing page at:
  https://yourdomain.com/launch
*/

(function(){
  const params = new URLSearchParams(window.location.search);
  const gumletUrl = params.get("v");
  const iframe = document.getElementById("gumletPlayer");
  const cta = document.getElementById("ctaArea");

  /*
    Gumlet embeds expose player state through postMessage.
    We track playback time from messages where available.
    If Gumlet reports cumulative playback time, the CTA unlocks
    after 30 seconds of actual playback.
  */

  let unlocked = false;
  let playedSeconds = 0;
  let lastReportedTime = null;

  function unlock(){
    if(unlocked) return;
    unlocked = true;
    cta.classList.add("visible");
  }

  if(gumletUrl){
    iframe.src = gumletUrl;
  }

  window.addEventListener("message", function(event){
    /*
      Only accept player-state messages originating from the embedded
      Gumlet player. We do not assume one fixed message shape; the
      handler supports common timestamp/state fields used by video players.
    */
    const data = event.data;
    if(!data) return;

    let currentTime = null;
    let playing = false;

    if(typeof data === "object"){
      if(typeof data.currentTime === "number") currentTime = data.currentTime;
      if(typeof data.time === "number") currentTime = data.time;
      if(typeof data.position === "number") currentTime = data.position;

      if(data.event === "play" || data.type === "play") playing = true;
      if(data.state === "playing" || data.status === "playing") playing = true;
    }

    if(typeof data === "string"){
      try{
        const parsed = JSON.parse(data);
        if(typeof parsed.currentTime === "number") currentTime = parsed.currentTime;
        if(typeof parsed.time === "number") currentTime = parsed.time;
        if(parsed.event === "play" || parsed.type === "play" ||
           parsed.state === "playing" || parsed.status === "playing"){
          playing = true;
        }
      }catch(e){}
    }

    if(currentTime !== null){
      if(lastReportedTime !== null && playing){
        const delta = currentTime - lastReportedTime;

        // Count only normal forward playback increments.
        if(delta > 0 && delta < 2){
          playedSeconds += delta;
        }
      }

      lastReportedTime = currentTime;

      if(playedSeconds >= 30){
        unlock();
      }
    }

    /*
      Some player events report the 30-second position directly.
      This does not unlock on a seek unless the player also reports
      normal playing state around that position.
    */
  });

  /*
    Some Gumlet implementations can be configured to expose playback
    events through postMessage. This listener also handles a completion
    event, ensuring the CTA remains available after the video continues.
  */
  window.addEventListener("message", function(event){
    const raw = event.data;
    const text = typeof raw === "string" ? raw.toLowerCase() : "";

    if(
      text.includes("30") &&
      (text.includes("timeupdate") || text.includes("playing"))
    ){
      unlock();
    }
  });

  /*
    No video URL means the iframe remains empty rather than showing
    fake content. This is intentional: a final page should never
    pretend a training video exists when one has not been connected.
  */
})();
</script>

</body>
</html>
